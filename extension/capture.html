<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take face photos</title>
<style>
  :root { --bg: #f4f2ee; --panel: #fff; --ink: #1d1d1f; --muted: #66645f; --line: #e3e0da; --accent: #2f5d50; --on-accent: #fff; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151618; --panel: #1e1f22; --ink: #ececee; --muted: #a09e99; --line: #2e2f33; --accent: #7fc3a9; --on-accent: #0f2a21; --bad: #ff8a80; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 12px; }
  .note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .bad { color: var(--bad); }
  button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); min-height: 38px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); width: 100%; margin-top: 16px; min-height: 44px; }
  #stage { position: relative; margin-top: 16px; aspect-ratio: 4 / 3; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  #ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #ring ellipse { fill: none; stroke-width: 1.6; }
  #ring .track { stroke: rgba(255, 255, 255, .5); }
  #ticks line { stroke: rgba(255, 255, 255, .45); stroke-width: .7; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  #ticks line.on { stroke: #8fd1a8; stroke-width: 2.4; }
  #ring #dot { fill: #fff; stroke: none; }
  #count { position: absolute; top: 10px; right: 12px; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
  #prompt { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px; text-align: center; color: #fff; font-size: 15px; background: linear-gradient(transparent, rgba(0, 0, 0, .65)); }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px 10px; }
  .shot { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .shot canvas { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
  .shot.filled { color: var(--ink); }
  .row { display: flex; gap: 8px; } .row button.primary { flex: 1; } .row button:not(.primary) { margin-top: 16px; min-height: 44px; }
</style>
</head>
<body>
<main>
  <h1>Take face photos</h1>
  <p class="note">Look at the camera, then turn your head slowly to one side and then to the other. Photos are taken as you turn, one every 10 degrees. They stay in this browser and are never uploaded.</p>
  <button type="button" class="primary" id="start">Start camera</button>
  <p class="note" id="status" role="status"></p>
  <div id="stage" hidden>
    <video id="video" playsinline muted></video>
    <svg id="ring" viewBox="0 0 100 75" preserveAspectRatio="none"><ellipse class="track" cx="50" cy="37" rx="19" ry="27"/><g id="ticks"></g><ellipse id="dot" rx=".9" ry="1.2" cx="50" cy="8" style="visibility: hidden"/></svg>
    <div id="count"></div>
    <div id="prompt" aria-live="polite"></div>
  </div>
  <section id="review" hidden>
    <h2>Your photos</h2>
    <div class="shots" id="shots"></div>
    <div class="row"><button type="button" id="again">Scan again</button><button type="button" class="primary" id="use" disabled>Use these photos</button></div>
  </section>
</main>
<script type="module" src="capture.js"></script>
</body>
</html>
