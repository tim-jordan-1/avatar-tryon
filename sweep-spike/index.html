<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweep Spike</title>
<style>
  body { margin: 0; padding: 16px; font: 14px/1.45 system-ui, -apple-system, sans-serif; background: #f4f2ee; color: #1d1d1f; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #66645f; margin: 20px 0 8px; }
  #status { color: #66645f; }
  table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; background: #fff; }
  td, th { padding: 4px 10px; border-bottom: 1px solid #e3e0da; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  canvas { max-width: 100%; border-radius: 8px; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
                 "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.1.1/vision_bundle.mjs" } }
</script>
</head>
<body>
<h1>Sweep spike: one head turn, many photos</h1>
<p id="status" role="status">Loading…</p>
<h2>Sweep</h2>
<div id="sweep"></div>
<h2>Twin against the real head, at angles no photo saw</h2>
<div id="score"></div>
<h2>Side by side (aligned): real head, 3 photos (today), all photos, all photos blended</h2>
<canvas id="sheet"></canvas>
<script type="module" src="./main.js"></script>
</body>
</html>
