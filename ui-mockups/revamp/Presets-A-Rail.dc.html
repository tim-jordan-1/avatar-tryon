<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera presets on a zoom rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.cam{transform-origin:50% 300px;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.fig{transform-box:view-box;transform-origin:100px 505px;animation:sway 7.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-2px) rotate(-.8deg)}75%{transform:translateX(2px) rotate(.8deg)}}
.head{transform-box:view-box;transform-origin:100px 108px;animation:look 11s ease-in-out infinite}
@keyframes look{0%,10%{transform:rotate(0)}18%,30%{transform:rotate(-5deg) translateX(-3px)}38%,50%{transform:rotate(0)}58%,70%{transform:rotate(4deg) translateX(3px)}78%,100%{transform:rotate(0)}}
.lid{transform-box:fill-box;transform-origin:50% 0;animation:blink 4.3s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
.layer{transition:opacity .4s ease}
.zone{display:flex;flex-direction:column;align-items:center;gap:4px;width:60px;min-height:60px;padding:8px 4px;border:0;border-radius:14px;background:transparent;color:#b9b9bf;font:500 11px Inter,system-ui,sans-serif;cursor:pointer}
.zone:hover{background:rgba(255,255,255,.06)}
.zone.on{background:#f4f1ea;color:#111}
.ang{height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#c9c9ce;font:500 13px Inter,system-ui,sans-serif}
.ang.on{background:rgba(255,255,255,.14);color:#fff}
@media (prefers-reduced-motion: reduce){.fig,.head{animation:none}.cam{transition:none}}
</style>
</helmet>
<div style="width: 400px; height: 860px; position: relative; overflow: hidden; background: #0e0f11; color: #ececee; font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 600px; overflow: hidden; background: radial-gradient(120% 70% at 50% 45%, #25272d 0%, #131417 65%, #0e0f11 100%)">
    <div class="cam" style="{{camStyle}}">
      <div style="height: 600px; display: flex; justify-content: center">
        <svg viewBox="0 0 200 520" width="192" height="500" style="margin-top: 70px" role="img" aria-label="{{alt}}">
          <defs>
            <linearGradient id="skin" x1="0" x2="1"><stop offset="0" stop-color="#dba07a"></stop><stop offset=".6" stop-color="#c98a62"></stop><stop offset="1" stop-color="#a86d4a"></stop></linearGradient>
            <linearGradient id="tee" x1="0" x2="1"><stop offset="0" stop-color="#7a68e4"></stop><stop offset=".55" stop-color="#6150cc"></stop><stop offset="1" stop-color="#4436a0"></stop></linearGradient>
            <linearGradient id="short" x1="0" x2="1"><stop offset="0" stop-color="#46536d"></stop><stop offset="1" stop-color="#262f42"></stop></linearGradient>
            <linearGradient id="chino" x1="0" x2="1"><stop offset="0" stop-color="#c8b28a"></stop><stop offset=".6" stop-color="#b59d73"></stop><stop offset="1" stop-color="#97805a"></stop></linearGradient>
          </defs>
          <ellipse cx="100" cy="508" rx="56" ry="7" fill="#000" opacity=".45"></ellipse>
          <g class="fig">
            <path fill="url(#skin)" d="M74 340 L72 420 Q71 450 77 480 L91 480 Q94 450 95 420 L98 342 Z M126 340 L128 420 Q129 450 123 480 L109 480 Q106 450 105 420 L102 342 Z"></path>
            <path fill="#f2f2f0" d="M74 476 Q70 498 64 503 L97 505 Q98 490 93 476 Z M126 476 Q130 498 136 503 L103 505 Q102 490 107 476 Z"></path>
            <path fill="#8d939b" d="M63 502 L98 504 L98 508 L62 506 Z M137 502 L102 504 L102 508 L138 506 Z"></path>
            <g class="layer" opacity="{{shortsOp}}">
              <path fill="url(#short)" d="M66 268 L134 268 L140 352 Q122 356 103 352 L100 304 L97 352 Q78 356 60 352 Z"></path>
              <path fill="#252e40" d="M66 265 L134 265 L135 278 L65 278 Z"></path>
              <path d="M97 278 Q95 290 92 297 M103 278 Q105 290 108 297 M64 281 L61 348 M136 281 L139 348" stroke="#ededed" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
            </g>
            <g class="layer" opacity="{{pantsOp}}">
              <path fill="url(#chino)" d="M66 266 L134 266 L136 330 L131 478 L107 480 L101 304 L99 304 L93 480 L69 478 L64 330 Z"></path>
              <path fill="#a38b63" d="M66 261 L134 261 L134 274 L66 274 Z M68 468 L93 470 L93 480 L69 478 Z M132 468 L107 470 L107 480 L131 478 Z"></path>
              <path fill="#8e7854" d="M73 259 h4 v17 h-4 Z M123 259 h4 v17 h-4 Z"></path>
              <path d="M84 300 L82 466 M116 300 L118 466 M71 276 Q79 289 77 305 M129 276 Q121 289 123 305" stroke="#7f6a49" stroke-width="1.1" fill="none" opacity=".6"></path>
            </g>
            <path d="M47 176 Q42 210 44 240 Q46 270 51 296" stroke="#c48660" stroke-width="15" fill="none" stroke-linecap="round"></path><ellipse cx="51" cy="302" rx="7.5" ry="10" fill="#bf805a"></ellipse>
            <path d="M153 176 Q158 210 156 240 Q154 270 149 296" stroke="#b97a55" stroke-width="15" fill="none" stroke-linecap="round"></path><ellipse cx="149" cy="302" rx="7.5" ry="10" fill="#b0724e"></ellipse>
            <path fill="#b97a55" d="M90 98 L110 98 L112 130 L88 130 Z"></path>
            <path fill="url(#tee)" d="M88 122 Q100 132 112 122 L140 130 Q152 134 158 150 L164 186 L146 192 L140 168 L138 272 Q100 280 62 272 L60 168 L54 192 L36 186 L42 150 Q48 134 60 130 Z"></path>
            <path d="M88 122 Q100 134 112 122" stroke="#3a2e8a" stroke-width="3" fill="none"></path>
            <path d="M76 200 Q82 230 78 262 M124 200 Q118 230 122 262" stroke="#352a80" opacity=".35" fill="none" stroke-width="1.5"></path>
            <g class="head">
              <ellipse cx="73" cy="76" rx="5" ry="8" fill="#c08259"></ellipse>
              <ellipse cx="127" cy="76" rx="5" ry="8" fill="#b37550"></ellipse>
              <ellipse cx="100" cy="72" rx="27" ry="33" fill="url(#skin)"></ellipse>
              <path fill="#2b1d16" d="M72 76 C68 44 84 32 102 32 C124 32 134 46 128 76 C126 62 120 54 108 51 C98 57 84 55 76 60 C74 64 73 70 72 76 Z"></path>
              <ellipse cx="89" cy="73" rx="5.2" ry="3.4" fill="#f7f3ee"></ellipse><ellipse cx="111" cy="73" rx="5.2" ry="3.4" fill="#f7f3ee"></ellipse>
              <circle cx="89" cy="73" r="2.6" fill="#3a2418"></circle><circle cx="111" cy="73" r="2.6" fill="#3a2418"></circle>
              <ellipse class="lid" cx="89" cy="71" rx="6" ry="5" fill="#c48660"></ellipse><ellipse class="lid" cx="111" cy="71" rx="6" ry="5" fill="#c48660"></ellipse>
              <path d="M83 63.5 Q89 61 95 62.5 M105 62.5 Q111 61 117 63.5" stroke="#2b1d16" stroke-width="2.2" fill="none" stroke-linecap="round"></path>
              <path d="M100 76 Q97 86 100 88 Q103 88.5 105 87" stroke="#9a5f3e" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
              <path d="M91 94 Q100 100 109 94" stroke="#7d3a30" stroke-width="2" fill="none" stroke-linecap="round"></path>
              <g class="layer" opacity="{{glassesOp}}">
                <path fill="#14181f" d="M79 67 h19 v6 q0 8 -9.5 8 q-9.5 0 -9.5 -8 Z M102 67 h19 v6 q0 8 -9.5 8 q-9.5 0 -9.5 -8 Z"></path>
                <path d="M98 69.5 Q100 68 102 69.5 M79 68 L73 71 M121 68 L127 71 M79 67 h19 M102 67 h19" stroke="#c9a34a" stroke-width="1.3" fill="none"></path>
                <path d="M82 70 l6 -1.5 M105 70 l6 -1.5" stroke="#fff" stroke-width="1" opacity=".4"></path>
              </g>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div style="position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 18px; background: rgba(20,21,24,.72); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(12px)">
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 15px; font-weight: 600">{{product}}</div>
      <div style="font-size: 12px; color: #a3a3a8; margin-top: 2px">{{productSub}}</div>
    </div>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #f4f1ea; color: #111; font: 600 14px Inter, system-ui, sans-serif">Read page</button>
  </div>

  <div style="position: absolute; top: 96px; left: 12px; display: flex; flex-direction: column; gap: 2px; padding: 4px; border-radius: 18px; background: rgba(20,21,24,.72); border: 1px solid rgba(255,255,255,.08)" role="group" aria-label="Camera preset">
    <sc-for list="{{zones}}" as="z" hint-placeholder-count="4">
      <button type="button" class="{{z.cls}}" onClick="{{z.pick}}" aria-pressed="{{z.on}}">
        <svg width="22" height="30" viewBox="0 0 22 30" aria-hidden="true"><circle cx="11" cy="4" r="3" fill="{{z.c0}}"></circle><rect x="6" y="8.5" width="10" height="10" rx="2.5" fill="{{z.c1}}"></rect><rect x="6.5" y="19.5" width="4" height="10" rx="2" fill="{{z.c2}}"></rect><rect x="11.5" y="19.5" width="4" height="10" rx="2" fill="{{z.c2}}"></rect></svg>
        {{z.label}}
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; top: 96px; right: 12px; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(127,195,169,.16); color: #a6dcc6; font-size: 12px; font-weight: 600">
    <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3 L13.8 9.2 L20 11 L13.8 12.8 L12 19 L10.2 12.8 L4 11 L10.2 9.2 Z"></path></svg>{{autoLabel}}
  </div>

  <div style="position: absolute; top: 540px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(20,21,24,.8); border: 1px solid rgba(255,255,255,.08)" role="group" aria-label="Camera angle">
    <button type="button" class="ang on">Front</button><button type="button" class="ang">Side</button><button type="button" class="ang">Back</button><button type="button" class="ang">¾</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 260px; padding: 10px 16px 16px; border-radius: 24px 24px 0 0; background: #17181b; border-top: 1px solid rgba(255,255,255,.08); box-sizing: border-box">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #3a3b40; margin: 0 auto 14px"></div>
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="font-size: 40px; font-weight: 700; line-height: 1">{{size}}</div>
      <div><div style="font-size: 14px; font-weight: 600">{{verdict}}</div><div style="font-size: 12px; color: #a3a3a8">{{verdictSub}}</div></div>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 0 0; margin-top: 12px; border-top: 1px solid rgba(255,255,255,.07); font-size: 14px">
        <span>{{r.name}}</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #c9c9ce"><span style="width: 8px; height: 8px; border-radius: 50%; background: #7fc3a9"></span>{{r.val}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { zone: 'face' }; }
  renderVals() {
    const P = {
      full: { label: 'Full', s: 1, t: 0, product: 'Everyday Crew Tee', sub: 'Slate Blue · 95% cotton', auto: 'Whole outfit', size: 'M', verdict: 'Fits you best', vsub: 'Every region inside the range.', rows: [['Chest', 'Good'], ['Hip', 'Good']], g: 0, p: 0 },
      face: { label: 'Face', s: 3.0, t: 503, product: 'Aviator Sunglasses', sub: 'Gold frame · 58 mm lens', auto: 'Auto: eyewear', size: '58', verdict: 'Suits your face width', vsub: 'Frame 138 mm, your face 141 mm.', rows: [['Frame width', 'Good'], ['Temple length', 'Good']], g: 1, p: 0 },
      torso: { label: 'Torso', s: 1.7, t: 92, product: 'Everyday Crew Tee', sub: 'Slate Blue · 95% cotton', auto: 'Auto: tops', size: 'M', verdict: 'Fits you best', vsub: 'Chest and waist inside the range.', rows: [['Chest', 'Good'], ['Waist', 'Good']], g: 0, p: 0 },
      legs: { label: 'Legs', s: 1.45, t: -194, product: 'Relaxed Chino', sub: 'Stone · 98% cotton twill', auto: 'Auto: trousers', size: '32', verdict: 'Fits you best', vsub: 'Waist and inseam inside the range.', rows: [['Waist', 'Good'], ['Inseam', 'Good']], g: 0, p: 1 },
    };
    const z = this.state.zone, cur = P[z];
    const on = '#f4f1ea', off = '#55565c', hot = '#7fc3a9';
    const zones = ['full', 'face', 'torso', 'legs'].map((k) => {
      const sel = k === z, base = sel ? '#6b6b70' : off, lit = sel ? '#111' : on;
      return {
        label: P[k].label, on: sel, cls: sel ? 'zone on' : 'zone',
        c0: k === 'full' || k === 'face' ? (sel ? '#111' : hot) : base,
        c1: k === 'full' || k === 'torso' ? (sel ? '#111' : hot) : base,
        c2: k === 'full' || k === 'legs' ? (sel ? '#111' : hot) : base,
        pick: () => this.setState({ zone: k }),
      };
    });
    return {
      zones,
      camStyle: 'transform: translateY(' + cur.t + 'px) scale(' + cur.s + ')',
      glassesOp: cur.g, pantsOp: cur.p, shortsOp: 1 - cur.p,
      product: cur.product, productSub: cur.sub, autoLabel: cur.auto,
      size: cur.size, verdict: cur.verdict, verdictSub: cur.vsub,
      rows: cur.rows.map(([name, val]) => ({ name, val })),
      alt: 'Avatar framed on the ' + cur.label.toLowerCase(),
    };
  }
}
</script>
</body>
</html>
